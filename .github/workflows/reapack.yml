name: Build ReaPack Index

on:
push:
branches:
- main

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Install Ruby
    uses: ruby/setup-ruby@v1
    with:
      ruby-version: '3.2'

  - name: Install Pandoc
    run: |
      sudo apt-get update
      sudo apt-get install -y pandoc

  - name: Install ReaPack Indexer
    run: gem install reapack-index

  - name: Generate ReaPack Index
    run: |
      yes | reapack-index --name "JCMega Scripts" .

  - name: Commit Updated Index
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      git add index.xml

      if ! git diff --cached --quiet; then
        git commit -m "Update ReaPack index"
        git push
      fi
```
