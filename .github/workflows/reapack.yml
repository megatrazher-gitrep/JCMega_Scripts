name: Build ReaPack Index

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Generate index.xml
        run: |
          reapack-index --name "JCMega Scripts" .

      - name: Commit index.xml
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add index.xml

          git diff --cached --quiet || \
          git commit -m "Update ReaPack index"

          git push